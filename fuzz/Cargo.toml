[package]
name = "provenance-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
provenance-core = { path = "../crates/provenance-core" }
provenance-log = { path = "../crates/provenance-log" }

[[bin]]
name = "registry_parsing"
path = "fuzz_targets/registry_parsing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_parsing"
path = "fuzz_targets/manifest_parsing.rs"
test = false
doc = false
bench = false
