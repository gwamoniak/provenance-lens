[workspace]
resolver = "2"
members = [
    "crates/provenance-core",
    "crates/provenance-cli",
    "crates/provenance-wasm",
]
# The fuzz crate needs nightly (cargo-fuzz/libFuzzer); keeping it out of the
# workspace keeps the stable `cargo test --workspace` loop bare-machine clean.
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gwamoniak/provenance-lens"

[profile.release]
# The WASM artifact ships inside a browser extension; size matters more than
# the last percent of speed.
opt-level = "s"
lto = true
strip = true
