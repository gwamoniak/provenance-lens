# CI baseline (U4). The push/PR job is the hard gate and runs the exact
# loop every implementer runs locally, plus the wasm32 type-check that
# protects the extension surface. Cargo-audit remains ADVISORY because failing
# on advisories is a maintainer decision. The fuzz smoke is enforcing after
# the c2pa 0.90.13 upgrade fixed the known SaltHash JUMBF underflow; it now
# also exercises the explicit SVG parser path. No third-party actions beyond
# actions/checkout; the runner's rustup honors rust-toolchain.toml on the
# first cargo call.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "43 5 * * 1" # weekly, Monday 05:43 UTC (audit + fuzz smoke)

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: wasm32 type-check (extension engine surface)
        run: cargo check -p provenance-wasm --target wasm32-unknown-unknown

  audit-and-fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo audit (advisory only — enforcing is a maintainer decision)
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Fuzz smoke, 5 minutes (enforcing)
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
          cargo +nightly fuzz run manifest_parsing fuzz/corpus fuzz/corpus_seed -- -max_total_time=300
