# Native, reduced-feature, and real-WASM checks run on each push/PR.
# Cargo-audit remains advisory; scheduled fuzzing is enforcing.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bzh_model_url:
        description: "Optional HTTPS URL of an exported IMATAG bzh ONNX model"
        required: false
        type: string
      bzh_model_sha256:
        description: "SHA-256 of that ONNX model (required when URL is set)"
        required: false
        type: string
  schedule:
    - cron: "43 5 * * 1" # weekly, Monday 05:43 UTC (audit + fuzz smoke)

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Source and dependency identity
        run: |
          git rev-parse HEAD
          sha256sum Cargo.lock
          rustc --version
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Core without default features
        run: cargo test -p provenance-core --no-default-features --locked
      - name: Independent local registry verifier
        run: |
          cargo build -p provenance-log --bin plog --locked
          node scripts/registry_test.mjs
      - name: Extension JavaScript helpers
        run: |
          node scripts/scan_support_test.mjs
          node scripts/background_test.mjs
          node scripts/inspect_test.mjs
          node scripts/calibration_audit_test.mjs
          node scripts/package_checks_test.mjs
      - name: wasm32 type-check (extension engine surface)
        run: cargo check -p provenance-wasm --target wasm32-unknown-unknown --locked
      - name: Install wasm-pack 0.15.0
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build and exercise standalone WASM
        run: |
          wasm-pack build crates/provenance-wasm --target web --out-dir ../../target/ci-wasm --locked
          wasm-pack --version
          node scripts/wasm_smoke.mjs target/ci-wasm
      - name: Chromium and Firefox image lifecycle
        run: |
          npm install --prefix target/browser-tests --no-save playwright@1.62.1
          node target/browser-tests/node_modules/playwright/cli.js install --with-deps chromium firefox
          NODE_PATH="$PWD/target/browser-tests/node_modules" node scripts/scan_browser_test.mjs target/ci-wasm
          NODE_PATH="$PWD/target/browser-tests/node_modules" node scripts/inspect_browser_test.mjs target/ci-wasm
          NODE_PATH="$PWD/target/browser-tests/node_modules" node scripts/extension_worker_test.mjs target/ci-wasm

  model-test:
    if: github.event_name == 'workflow_dispatch' && inputs.bzh_model_url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a model digest and HTTPS source
        env:
          MODEL_URL: ${{ inputs.bzh_model_url }}
          MODEL_SHA256: ${{ inputs.bzh_model_sha256 }}
        run: |
          test "$MODEL_SHA256" = '4f7d80027d5d7ecf5c176fabc3d86c8ccd791cc5c830d23a96114425cd1f3e57'
          case "$MODEL_URL" in https://*) ;; *) exit 1 ;; esac
      - name: Download and verify the supplied model
        env:
          MODEL_URL: ${{ inputs.bzh_model_url }}
          MODEL_SHA256: ${{ inputs.bzh_model_sha256 }}
        run: |
          curl --fail --location --max-time 300 --max-filesize 67108864 --proto '=https' --proto-redir '=https' --tlsv1.2 "$MODEL_URL" --output "$RUNNER_TEMP/bzh.onnx"
          echo "$MODEL_SHA256  $RUNNER_TEMP/bzh.onnx" | sha256sum -c -
      - name: Run model known-answer test (no skip)
        env:
          PROVENANCE_LENS_BZH_ONNX: ${{ runner.temp }}/bzh.onnx
        run: cargo test -p provenance-core --features stable-signature --test stable_signature --locked -- --ignored

  audit-and-fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo audit (advisory only — enforcing is a maintainer decision)
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Fuzz smoke, 5 minutes (enforcing)
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
          cargo +nightly fuzz run manifest_parsing fuzz/corpus fuzz/corpus_seed -- -max_total_time=300
          cargo +nightly fuzz run registry_parsing -- -max_total_time=60 -max_len=2048
