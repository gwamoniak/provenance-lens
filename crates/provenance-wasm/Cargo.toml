[package]
name = "provenance-wasm"
description = "wasm-bindgen wrapper exposing the provenance pipeline to the browser extension"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
provenance-core = { path = "../provenance-core" }
wasm-bindgen = "0.2"

# Parity tests parse the wrapper's JSON output; dev-only.
[dev-dependencies]
serde_json = "1"

# wasm-pack's bundled wasm-opt predates bulk-memory ops and fails on this
# module; optimization is an explicit post-build step with system binaryen
# (see .claude/skills/wasm-packaging/SKILL.md for the exact flags).
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
