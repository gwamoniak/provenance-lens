[package]
name = "provenance-core"
description = "Four-layer AI-content provenance pipeline: C2PA proof, watermark detection, registry lookup, optional heuristics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# M1 dependency (ExecPlan Decision Log): the c2pa crate with default features
# OFF — no OpenSSL (rust-native crypto keeps bare-machine and wasm32 builds
# clean) and no HTTP clients (the core is sans-IO; remote manifest fetching
# must be impossible, not merely disabled).
[features]
# W1 (roadmap plan): the Stable Diffusion invisible-watermark detector needs
# pixel decoding. Default-on for native (CLI); provenance-wasm opts out with
# default-features = false so the extension engine's size budget is untouched
# until a measured size check says otherwise.
default = ["watermark-dwt"]
watermark-dwt = ["dep:image"]
# W2 (roadmap plan): the IMATAG Stable Signature (bzh) classifier via
# pure-Rust ONNX inference. Opt-in and native-only; the model file itself is
# never bundled — the caller supplies it at runtime (CLI --watermark-model).
stable-signature = ["watermark-dwt", "dep:tract-onnx"]

[dependencies]
c2pa = { version = "0.89.2", default-features = false, features = ["rust_native_crypto"] }
# W1 dependency (roadmap plan Decision Log): pixel decoding for the watermark
# layer only — JPEG + PNG codecs, nothing else. Optional: absent from wasm
# and from any build without the watermark-dwt feature.
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }
# W2 dependency (roadmap plan Decision Log): pure-Rust ONNX runtime for the
# Stable Signature classifier — no C++ runtime, no build-time downloads.
tract-onnx = { version = "0.21", optional = true }

[dev-dependencies]
base64 = "0.22"
# Cert-policy pinning tests (tests/cert_policy.rs) build their own X.509
# chains — expired validity, disallowed signature algorithm — which the
# public EphemeralSigner cannot produce. Every crate below is already in
# the dependency tree via c2pa itself (same versions as Cargo.lock), so
# this adds no new supply-chain surface.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc", "pkcs8"] }
pkcs8 = { version = "0.10", features = ["pem"] }
rasn = "0.28"
rasn-pkix = "0.28"
sha1 = "0.10"

[[example]]
name = "gen_vectors"

[[example]]
name = "measure_fpr"
required-features = ["watermark-dwt"]

[[example]]
name = "calibrate"
required-features = ["watermark-dwt"]
